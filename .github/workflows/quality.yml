name: Quality

# React + Rust/Tauri 质量门禁与桌面烟测。
# dev 是测试分支，main 是受保护的正式发布分支。
on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: quality-web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  rust:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: actions/download-artifact@v8
        with:
          name: quality-web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Rust check
        working-directory: src-tauri
        run: cargo check --locked
      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --all-features --locked

  # 完整桌面进程烟测独立于 Rust 静态门禁，xvfb 提供 X display。
  desktop-smoke:
    needs: [frontend, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev xvfb
      - uses: actions/download-artifact@v8
        with:
          name: quality-web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # 烟测：启动完整进程内 Rust 应用并完成 state 初始化。
      - name: Desktop smoke test
        working-directory: src-tauri
        run: xvfb-run -a cargo run -- --smoke-test
