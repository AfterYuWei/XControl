[package]
name = "xcontrol"
version = "1.0.0"
description = "XControl 桌面壳（Tauri 2）：管理 xcontrol-server sidecar 与桌面能力"
authors = ["yuweinfo"]
license = "MIT"
repository = "https://github.com/AfterYuWei/XControl"
edition = "2021"
rust-version = "1.77.2"

# 移动端预留（docs/TAURI_MIGRATION.md §14）：桌面逻辑全部 #[cfg(desktop)] 门控，
# 未来 tauri ios/android init 时以 staticlib/cdylib 形式复用。
[lib]
name = "xcontrol_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# `tauri build` 编译时自动启用该 feature：webview 使用打包资产（frontendDist，
# tauri://localhost 等自定义协议）；未启用时 tauri 视为 dev 模式并加载 devUrl。
# 纯 cargo build --release 想要生产行为需显式 --features custom-protocol。
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# 文件拖出到系统（社区插件，crabnebula 维护，见方案 §1.8/§12）
tauri-plugin-drag = "2"
# 应用内更新（stable 通道：GitHub Releases latest.json，见方案 §8.2）
tauri-plugin-updater = "2"
# 更新完成后重启
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
getrandom = "0.3"
# 异步命令（get_backend_info）的阻塞等待轮询
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_os = "linux")'.dependencies]
# PR_SET_PDEATHSIG：父进程死亡时由内核向 sidecar 发 SIGTERM，杜绝孤儿进程
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
