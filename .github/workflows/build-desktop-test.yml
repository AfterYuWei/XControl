name: Build Desktop Test

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整历史计算提交计数，作为单调递增的 test 构建号。
          fetch-depth: 0

      - id: meta
        shell: bash
        run: |
          BASE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION 必须是 SemVer（x.y.z），当前值: $BASE_VERSION" >&2
            exit 1
          fi
          # 版本号 = 基础版本 + 提交计数 + 短 SHA：提交计数随历史单调递增，
          # 保证 NSIS / 应用内更新始终把新测试包判定为“升级”而非“降级”
          # （-test.<sha> 的字典序无法保证递增，会导致 Windows 覆盖安装被
          # 强制要求先卸载）；短 SHA 提供可追溯性。同一提交两条流水线得到
          # 相同版本号，重跑时资产覆盖到同一个 test Release。
          TEST_BUILD="$(git rev-list --count HEAD)"
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="${BASE_VERSION}-test.${TEST_BUILD}.${SHORT_SHA}"
          TAG="test-v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=eizhu ${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    uses: ./.github/workflows/build-desktop.yml
    with:
      channel: test
      version: ${{ needs.metadata.outputs.version }}
      tag: ${{ needs.metadata.outputs.tag }}
      release_name: ${{ needs.metadata.outputs.release_name }}
    secrets: inherit
