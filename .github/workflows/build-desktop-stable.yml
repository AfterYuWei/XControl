name: Build Desktop Stable

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: meta
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION 必须是稳定版 SemVer（x.y.z），当前值: $VERSION" >&2
            exit 1
          fi
          TAG="v${VERSION}"

          # main 上的每个合并都是一次正式发版；必须先提升 VERSION，
          # 防止不同提交复用同一应用版本或覆盖已有 Release。
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "正式版 ${VERSION} 已存在；合并到 main 前请先提升 VERSION" >&2
            exit 1
          elif [ "$STATUS" -ne 2 ]; then
            echo "无法检查远端版本标记（git ls-remote 退出码 $STATUS）" >&2
            exit "$STATUS"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=XControl $VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    uses: ./.github/workflows/build-desktop.yml
    with:
      channel: stable
      version: ${{ needs.metadata.outputs.version }}
      tag: ${{ needs.metadata.outputs.tag }}
      release_name: ${{ needs.metadata.outputs.release_name }}
    secrets: inherit
