[package]
name = "tauri-plugin-session-keepalive"
version = "0.1.0"
authors = ["yuweinfo"]
description = "eizhu mobile SSH/SFTP background recovery window"
edition = "2021"
rust-version = "1.89"
links = "tauri-plugin-session-keepalive"

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2" }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
