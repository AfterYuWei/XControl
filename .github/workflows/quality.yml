name: Quality

# tauri 分支版本：electron-smoke 替换为 Tauri 桌面烟测（cargo fmt/clippy/test + --smoke-test）。
# branches 含 main 是为合并回 main 后无需修改本文件（per-ref 工作流机制见 build-desktop.yml 头部注释）。
on:
  pull_request:
  push:
    branches:
      - tauri
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: server/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...

  # Tauri 桌面壳：Rust 静态检查 + 单测 + 隐藏窗口烟测（xvfb 提供 X display）
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: server/go.sum

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri CLI
        run: npm ci

      # 前端构建（generate_context! 编译期嵌入 web_dist 需要）+ Go sidecar + triple 拷贝
      - name: Prepare sidecar and frontend
        run: node scripts/prepare-sidecar.mjs --build

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # 烟测：启动完整应用（隐藏窗口）→ sidecar 健康/鉴权/CORS 断言 → 优雅退出
      - name: Desktop smoke test
        working-directory: src-tauri
        run: xvfb-run -a cargo run -- --smoke-test
