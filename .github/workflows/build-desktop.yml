name: Desktop Build Core

# stable/test 入口分别位于 build-desktop-stable.yml 与
# build-desktop-test.yml。本文件只承载可复用的三平台构建和发布步骤。
on:
  workflow_call:
    inputs:
      channel:
        description: '发布通道（stable/test）'
        required: true
        type: string
      version:
        description: 'SemVer 版本号'
        required: true
        type: string
      tag:
        description: 'CI 为 GitHub Release 自动创建的标签'
        required: true
        type: string
      release_name:
        description: 'GitHub Release 名称'
        required: true
        type: string

# 同一分支和通道的新构建取消旧构建。
concurrency:
  group: build-desktop-tauri-${{ inputs.channel }}-${{ github.ref }}
  cancel-in-progress: true

# Release 上传需要写权限
permissions:
  contents: write

jobs:
  # 三平台并行构建（macOS 仅 arm64，Linux deb+rpm+AppImage）
  build:
    env:
      VITE_XCONTROL_CHANNEL: ${{ inputs.channel }}
      XCONTROL_BUILD_CHANNEL: ${{ inputs.channel }}
    strategy:
      fail-fast: false   # 单平台失败不取消其它平台，便于排查
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
          - os: macos-latest      # Apple Silicon runner → arm64
            platform: mac-arm64
          - os: ubuntu-latest
            platform: linux-x64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Linux: Tauri 系统依赖（webkit2gtk 等）+ deb/rpm 打包工具
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            binutils rpm xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri CLI
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Set version in tauri.conf.json
        shell: bash
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          # 直接用 node 改写 tauri.conf.json 的 version 字段（替代旧 electron/package.json 注入）
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.version=process.env.APP_VERSION;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');console.log('version set to:',process.env.APP_VERSION);"

      # 应用内更新签名：配置 secrets（TAURI_SIGNING_PRIVATE_KEY 等）后自动启用；
      # 未配置时跳过签名正常出包（仅应用内更新不可用，安装包本身不受影响）。
      # 私钥生成：npx tauri signer generate -w xcontrol-updater.key
      - name: Enable updater artifacts (requires signing key)
        shell: bash
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$UPDATER_KEY" ]; then
            echo "==> 未配置 TAURI_SIGNING_PRIVATE_KEY，跳过更新产物签名（应用内更新不可用）"
          else
            echo "TAURI_SIGNING_PRIVATE_KEY=$UPDATER_KEY" >> $GITHUB_ENV
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$UPDATER_KEY_PASSWORD" >> $GITHUB_ENV
            node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.bundle.createUpdaterArtifacts=true;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');"
            echo "==> 已启用更新产物签名（createUpdaterArtifacts）"
          fi

      # macOS 签名公证：配置 secrets（Tauri 命名）后自动启用，无则跳过签名
      - name: Setup macOS signing env
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_B64: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_B64" ]; then
            echo "==> macOS 无签名证书，跳过代码签名"
          else
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE_B64" >> $GITHUB_ENV
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" >> $GITHUB_ENV
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> $GITHUB_ENV
            echo "APPLE_ID=$APPLE_ID" >> $GITHUB_ENV
            echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> $GITHUB_ENV
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> $GITHUB_ENV
            echo "==> macOS 已配置签名环境变量，启用签名公证"
          fi

      # beforeBuildCommand 自动完成 React 构建，Rust 领域随主程序一起编译。
      - name: Build Tauri app
        run: npx tauri build

      # 直接运行 release 二进制，验证打包后的进程内状态初始化。
      - name: Smoke test Windows release runtime
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 2
        run: |
          # release 构建使用 windows GUI subsystem，不附加控制台，因此用退出码
          # 而不是 stdout marker 判断烟测结果。
          $process = Start-Process `
            -FilePath "src-tauri/target/release/XControl.exe" `
            -ArgumentList "--smoke-test" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Windows release smoke test failed with exit code $($process.ExitCode)"
          }

      # 从最终 .app 内启动，覆盖 release cfg 与进程内初始化。
      - name: Smoke test macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 2
        run: |
          # macOS runner 可能通过 Cargo build.target 把产物放到额外目录；
          # 产品名也可能由配置覆盖，因此不要写死 target/release 或 .app 名称。
          APP_ROOT="$(find src-tauri/target -type d -name '*.app' -print -quit)"
          if [ -z "$APP_ROOT" ]; then
            echo "macOS app bundle was not found under src-tauri/target" >&2
            find src-tauri/target -maxdepth 8 -print
            exit 1
          fi
          APP_BIN="$APP_ROOT/Contents/MacOS"
          if [ ! -d "$APP_BIN" ]; then
            echo "macOS app bundle has no Contents/MacOS directory: $APP_ROOT" >&2
            find "$APP_ROOT" -maxdepth 4 -print
            exit 1
          fi
          if ! MAIN_BINARY="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_ROOT/Contents/Info.plist")"; then
            echo "unable to read CFBundleExecutable from $APP_ROOT/Contents/Info.plist" >&2
            exit 1
          fi
          APP_EXECUTABLE="$APP_BIN/$MAIN_BINARY"
          MARKER="$RUNNER_TEMP/xcontrol-tauri-smoke-ok"

          echo "==> macOS app bundle: $APP_ROOT"
          ls -la "$APP_BIN"
          if [ ! -x "$APP_EXECUTABLE" ]; then
            echo "macOS app executable is missing or not executable: $APP_EXECUTABLE" >&2
            exit 1
          fi
          rm -f "$MARKER"
          set +e
          OUTPUT="$(XCONTROL_SMOKE_MARKER_PATH="$MARKER" "$APP_EXECUTABLE" --smoke-test 2>&1)"
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            echo "macOS app bundle smoke test failed with exit code $STATUS" >&2
            exit "$STATUS"
          fi
          if ! grep -qx "XCONTROL_TAURI_SMOKE_OK" "$MARKER"; then
            echo "macOS app exited successfully without completing smoke checks" >&2
            exit 1
          fi

      # 统一产物上传：安装包 + 更新产物（.sig / macOS app.tar.gz，签名启用时才有）
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xcontrol-tauri-${{ inputs.channel }}-${{ matrix.platform }}-${{ inputs.version }}
          path: |
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/nsis/*.sig
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/macos/*.app.tar.gz
            src-tauri/target/**/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/**/bundle/rpm/*.rpm
            src-tauri/target/**/bundle/appimage/*.AppImage
            src-tauri/target/**/bundle/appimage/*.AppImage.sig
          if-no-files-found: error
          retention-days: 30

  # 发布：main 分支发正式 Release，dev 分支发 prerelease Release。
  # GitHub Release 必须关联 tag，该 tag 由 CI 生成，不再作为发版入口。
  release:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: tauri-release-publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # upload-artifact 会保留多个 glob 的公共目录层级；统一扁平化后再发布，
      # 避免 release-assets/*.exe 等根目录 glob 静默匹配不到任何文件。
      - name: Flatten release assets
        shell: bash
        run: |
          mkdir -p release-assets
          while IFS= read -r -d '' FILE; do
            NAME="$(basename "$FILE")"
            if [ -e "release-assets/$NAME" ]; then
              echo "duplicate release asset name: $NAME" >&2
              exit 1
            fi
            cp "$FILE" "release-assets/$NAME"
          done < <(find artifacts -type f -print0)
          if [ -z "$(find release-assets -type f -print -quit)" ]; then
            echo "no release assets were downloaded" >&2
            exit 1
          fi

      - name: List artifacts
        run: |
          echo "=== 准备发布的安装包 ==="
          find release-assets -type f | sort
          echo "=== 总大小 ==="
          du -sh release-assets

      # 每个通道各生成三平台清单；固定 tauri-update-channel Release 只承担
      # “当前版本指针”，清单里的下载 URL 仍指向本次不可变的版本 Release。
      - name: Generate updater manifests (signed builds)
        run: |
          if ls release-assets/*.sig > /dev/null 2>&1; then
            node scripts/make-latest-json.mjs "${{ inputs.version }}" "${{ inputs.tag }}" release-assets "${{ inputs.channel }}"
          else
            echo "==> 无签名产物，跳过 updater 清单（未配置 TAURI_SIGNING_PRIVATE_KEY）"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          # 分支推送创建的 tag 必须落在本次提交；否则 action
          # 会使用仓库默认分支 main 作为新标签目标。
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release_name }}
          body: |
            ## XControl ${{ inputs.version }}（Tauri 版）

            ${{ inputs.channel == 'stable' && '### ✅ 正式版（main）' || '### 🧪 测试版（dev）' }}

            ### 安装包

            | 平台 | 格式 | 说明 |
            |------|------|------|
            | Windows (x64) | NSIS 安装程序 `.exe` | 双击安装（当前用户模式，无需管理员） |
            | macOS (Apple Silicon) | DMG 镜像 | 打开后拖拽 XControl 到 Applications |
            | Linux (Debian/Ubuntu) | `.deb` | `sudo dpkg -i XControl*.deb` |
            | Linux (Fedora/RHEL) | `.rpm` | `sudo rpm -i XControl*.rpm` |
            | Linux (通用) | `.AppImage` | 免安装，直接运行 |

            ### 说明

            - 本 Release 由 **${{ inputs.channel == 'stable' && 'main' || 'dev' }} 分支**的 Tauri 2 构建管线产出
            - 从 Electron 版升级：连接配置、密钥、UI 偏好会被自动继承，无需手动迁移
            - Windows 新版安装程序支持直接覆盖升级，无需先卸载
            - **应用内更新**（设置 → 关于 → 检查更新）：Windows / macOS / Linux AppImage 支持；
              deb / rpm 用户需手动下载新包覆盖安装（`.app.tar.gz` 为应用内更新用的增量资产，无需手动下载）
          files: |
            release-assets/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ inputs.channel == 'test' }}
          generate_release_notes: true

      # GitHub 的 /releases/latest 不包含 prerelease，因此用固定 Release 保存
      # stable/test 两套可覆盖的通道清单。安装包本身仍保留在版本 Release 中。
      - name: Publish rolling update-channel manifests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          MANIFESTS=(release-assets/latest-${{ inputs.channel }}-*.json)
          if [ "${#MANIFESTS[@]}" -eq 0 ]; then
            echo "==> 本次无 updater 清单，跳过通道发布"
            exit 0
          fi
          if ! gh release view tauri-update-channel >/dev/null 2>&1; then
            gh release create tauri-update-channel \
              --prerelease \
              --target "${GITHUB_SHA}" \
              --title "XControl Tauri Update Channels" \
              --notes "应用内更新通道索引；请勿手动安装此 Release 的 JSON 文件。"
          fi
          gh release upload tauri-update-channel "${MANIFESTS[@]}" --clobber
