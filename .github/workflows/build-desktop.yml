name: Build Desktop Apps

# ═══════════════════════════════════════════════════════════════════════════
# Tauri 分支专用桌面构建 CI（本文件位于 tauri 分支）
#
# 双分支独立机制（见 docs/TAURI_MIGRATION.md §15）：
#   GitHub Actions 的 push 事件只读取「被推送 ref 上」的工作流文件版本，
#   因此 main 分支的 Electron 版 build-desktop.yml 与本文件天然互不干扰：
#     - 推送 main  → 走 main 上的 Electron 版工作流
#     - 推送 tauri → 走本文件（Tauri 构建）
#     - 打 v*/tauri-v* tag → 按 tag 所指向分支上的文件版本执行
#
# 触发条件：
#   - 推送 tauri 分支: pre 版（版本 0.0.0-pre.<日期>.<短commit>，tag=tauri-<短commit>，prerelease）
#   - 推送 tag (v* / tauri-v*): stable 版正式 Release
#   - 手动触发: 可选 stable / pre
#
# 合并回 main 时无需修改本文件：branches 已含 main、tags 已含 v*，
# 届时 main 上的旧 Electron 工作流被本文件替换，自动接管。
# ═══════════════════════════════════════════════════════════════════════════
on:
  push:
    branches:
      - tauri
      - main
    tags:
      - 'tauri-v*'
      - 'v*'
  workflow_dispatch:
    inputs:
      release_type:
        description: '构建类型'
        required: true
        default: 'pre'
        type: choice
        options:
          - stable
          - pre

# 同一 ref 的新构建取消旧的；group 与 main 分支的 Electron 工作流不同名，避免相互取消
concurrency:
  group: build-desktop-tauri-${{ github.ref }}
  cancel-in-progress: true

# Release 上传需要写权限
permissions:
  contents: write

jobs:
  # 判断本次构建是 stable(tag) 还是 pre(分支推送)
  prepare:
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.meta.outputs.is_release }}
      version: ${{ steps.meta.outputs.version }}
      release_name: ${{ steps.meta.outputs.release_name }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - id: meta
        run: |
          # tag 触发 或 手动选 stable => stable；分支推送 或 手动选 pre => pre
          if [[ "${{ github.ref_type }}" == "tag" ]] || [[ "${{ inputs.release_type }}" == "stable" ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

          # 版本号 & tag：
          # - stable(tag): version=tag 去 v/tauri-v 前缀(如 1.0.0)，tag=原 tag 名
          # - pre(分支推送): version=0.0.0-pre.<yyyymmdd>.<短commit>
          #   （日期前缀保证 semver 预发布版本单调递增，供未来 updater 使用，
          #     纯短 commit hash 字典序无序会导致 updater 漏更，见迁移方案 §8.1）
          #   tag=tauri-<短commit>（加前缀避免与 main 分支 Electron pre 版的 <短commit> tag 冲突）
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#tauri-v}"
            VERSION="${VERSION#v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "release_name=XControl $VERSION (Tauri stable)" >> $GITHUB_OUTPUT
          else
            STAMP=$(date -u +%Y%m%d)
            VERSION="0.0.0-pre.${STAMP}.${SHORT_SHA}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=tauri-$SHORT_SHA" >> $GITHUB_OUTPUT
            echo "release_name=XControl Tauri Pre $SHORT_SHA" >> $GITHUB_OUTPUT
          fi

  # 三平台并行构建（macOS 仅 arm64，Linux deb+rpm+AppImage）
  build:
    needs: prepare
    strategy:
      fail-fast: false   # 单平台失败不取消其它平台，便于排查
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
          - os: macos-latest      # Apple Silicon runner → arm64
            platform: mac-arm64
          - os: ubuntu-latest
            platform: linux-x64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Linux: Tauri 系统依赖（webkit2gtk 等）+ deb/rpm 打包工具
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            binutils rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: server/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri CLI
        run: npm ci

      - name: Set version in tauri.conf.json
        shell: bash
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # 直接用 node 改写 tauri.conf.json 的 version 字段（替代旧 electron/package.json 注入）
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.version=process.env.APP_VERSION;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');console.log('version set to:',process.env.APP_VERSION);"

      # 应用内更新签名：配置 secrets（TAURI_SIGNING_PRIVATE_KEY 等）后自动启用；
      # 未配置时跳过签名正常出包（仅应用内更新不可用，安装包本身不受影响）。
      # 私钥生成：npx tauri signer generate -w xcontrol-updater.key
      - name: Enable updater artifacts (requires signing key)
        shell: bash
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$UPDATER_KEY" ]; then
            echo "==> 未配置 TAURI_SIGNING_PRIVATE_KEY，跳过更新产物签名（应用内更新不可用）"
          else
            echo "TAURI_SIGNING_PRIVATE_KEY=$UPDATER_KEY" >> $GITHUB_ENV
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$UPDATER_KEY_PASSWORD" >> $GITHUB_ENV
            node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.bundle.createUpdaterArtifacts=true;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');"
            echo "==> 已启用更新产物签名（createUpdaterArtifacts）"
          fi

      # macOS 签名公证：配置 secrets（Tauri 命名）后自动启用，无则跳过签名
      - name: Setup macOS signing env
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_B64: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_B64" ]; then
            echo "==> macOS 无签名证书，跳过代码签名"
          else
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE_B64" >> $GITHUB_ENV
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" >> $GITHUB_ENV
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> $GITHUB_ENV
            echo "APPLE_ID=$APPLE_ID" >> $GITHUB_ENV
            echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> $GITHUB_ENV
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> $GITHUB_ENV
            echo "==> macOS 已配置签名环境变量，启用签名公证"
          fi

      # beforeBuildCommand（scripts/prepare-sidecar.mjs --build）自动完成：
      # web 前端构建（输出 server/web_dist）→ Go sidecar 编译 → externalBin triple 重命名拷贝
      - name: Build Tauri app
        run: npx tauri build

      # 直接运行 release 二进制，覆盖 externalBin 从带 triple 的构建源文件
      # 重命名为资源目录中 xcontrol-server.exe 后的真实启动路径。开发态
      # cargo run 烟测不会经过这条路径，无法发现“能出包但双击无窗口”。
      - name: Smoke test Windows release runtime
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 2
        run: |
          $sidecar = "src-tauri/target/release/xcontrol-server.exe"
          if (-not (Test-Path $sidecar)) {
            throw "Bundled sidecar was not copied to $sidecar"
          }
          # release 构建使用 windows GUI subsystem，不附加控制台，因此用退出码
          # 而不是 stdout marker 判断烟测结果。
          $process = Start-Process `
            -FilePath "src-tauri/target/release/XControl.exe" `
            -ArgumentList "--smoke-test" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Windows release smoke test failed with exit code $($process.ExitCode)"
          }

      # 从最终 .app 内启动，验证 macOS externalBin 位于 Contents/MacOS，
      # 同时覆盖 release cfg 与 sidecar 健康检查，而不只验证能否完成编译。
      - name: Smoke test macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 2
        run: |
          APP_ROOT="src-tauri/target/release/bundle/macos/XControl.app"
          APP_BIN="$APP_ROOT/Contents/MacOS"
          APP_EXECUTABLE="$APP_BIN/XControl"
          SIDECAR="$APP_BIN/xcontrol-server"
          MARKER="$RUNNER_TEMP/xcontrol-tauri-smoke-ok"

          echo "==> macOS app bundle executables"
          ls -la "$APP_BIN"
          if [ ! -x "$APP_EXECUTABLE" ]; then
            echo "macOS app executable is missing or not executable: $APP_EXECUTABLE" >&2
            exit 1
          fi
          if [ ! -x "$SIDECAR" ]; then
            echo "macOS bundled sidecar is missing or not executable: $SIDECAR" >&2
            exit 1
          fi

          rm -f "$MARKER"
          set +e
          OUTPUT="$(XCONTROL_SMOKE_MARKER_PATH="$MARKER" "$APP_EXECUTABLE" --smoke-test 2>&1)"
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            echo "macOS app bundle smoke test failed with exit code $STATUS" >&2
            exit "$STATUS"
          fi
          if ! grep -qx "XCONTROL_TAURI_SMOKE_OK" "$MARKER"; then
            echo "macOS app exited successfully without completing smoke checks" >&2
            exit 1
          fi

      # 统一产物上传：安装包 + 更新产物（.sig / macOS app.tar.gz，签名启用时才有）
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xcontrol-tauri-${{ matrix.platform }}-${{ needs.prepare.outputs.version }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error
          retention-days: 30

  # 发布：stable 版(tag)发正式 Release，pre 版(分支推送)发 prerelease Release
  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "=== 准备发布的安装包 ==="
          find artifacts -type f | sort
          echo "=== 总大小 ==="
          du -sh artifacts

      # stable 版且存在签名产物时生成 updater 清单（latest.json 只随 stable 发布，
      # 构成 stable-only 更新通道；pre 版本经 semver 比较在 stable 发布时收到升级）
      - name: Generate updater latest.json (stable + signed)
        if: needs.prepare.outputs.is_release == 'true'
        run: |
          if ls artifacts/*.sig > /dev/null 2>&1; then
            node scripts/make-latest-json.mjs "${{ needs.prepare.outputs.version }}" "${{ needs.prepare.outputs.tag }}" artifacts
          else
            echo "==> 无签名产物，跳过 latest.json（未配置 TAURI_SIGNING_PRIVATE_KEY）"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          body: |
            ## XControl ${{ needs.prepare.outputs.version }}（Tauri 版）

            ${{ needs.prepare.outputs.is_release == 'true' && '### ✅ Stable 版' || '### 🔄 Pre 版（基于 tauri 分支最新构建）' }}

            ### 安装包

            | 平台 | 格式 | 说明 |
            |------|------|------|
            | Windows (x64) | NSIS 安装程序 `.exe` | 双击安装（当前用户模式，无需管理员） |
            | macOS (Apple Silicon) | DMG 镜像 | 打开后拖拽 XControl 到 Applications |
            | Linux (Debian/Ubuntu) | `.deb` | `sudo dpkg -i XControl*.deb` |
            | Linux (Fedora/RHEL) | `.rpm` | `sudo rpm -i XControl*.rpm` |
            | Linux (通用) | `.AppImage` | 免安装，直接运行 |

            ### 说明

            - 本 Release 由 **tauri 分支** 的 Tauri 2 构建管线产出；main 分支仍发布 Electron 版
            - 从 Electron 版升级：连接配置、密钥、UI 偏好会被自动继承，无需手动迁移
            - 升级安装前建议退出旧版本应用
            - **应用内更新**（设置 → 关于 → 检查更新）：Windows / macOS / Linux AppImage 支持；
              deb / rpm 用户需手动下载新包覆盖安装（`.app.tar.gz` 为应用内更新用的增量资产，无需手动下载）
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.AppImage
            artifacts/*.app.tar.gz
            artifacts/latest.json
          draft: false
          # pre 版标记为预发布，stable 版为正式发布
          prerelease: ${{ needs.prepare.outputs.is_release != 'true' }}
          generate_release_notes: true
