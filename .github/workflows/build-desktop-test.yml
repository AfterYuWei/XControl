name: Build Desktop Test

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: meta
        shell: bash
        run: |
          BASE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION 必须是 SemVer（x.y.z），当前值: $BASE_VERSION" >&2
            exit 1
          fi
          # 版本号基于提交而非运行编号：Build Mobile 使用同一提交会得到
          # 相同的 test-v* 标签，Android APK 与桌面安装包得以合并进同一个
          # 测试 Release。同一提交重跑时复用该 Release 并覆盖同名资产。
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="${BASE_VERSION}-test.${SHORT_SHA}"
          TAG="test-v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=eizhu ${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    uses: ./.github/workflows/build-desktop.yml
    with:
      channel: test
      version: ${{ needs.metadata.outputs.version }}
      tag: ${{ needs.metadata.outputs.tag }}
      release_name: ${{ needs.metadata.outputs.release_name }}
    secrets: inherit
