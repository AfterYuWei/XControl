name: Build Desktop Test

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: meta
        shell: bash
        run: |
          BASE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION 必须是 SemVer（x.y.z），当前值: $BASE_VERSION" >&2
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="${BASE_VERSION}-test.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          TAG="test-v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=eizhu ${VERSION} (${SHORT_SHA})" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    uses: ./.github/workflows/build-desktop.yml
    with:
      channel: test
      version: ${{ needs.metadata.outputs.version }}
      tag: ${{ needs.metadata.outputs.tag }}
      release_name: ${{ needs.metadata.outputs.release_name }}
    secrets: inherit
