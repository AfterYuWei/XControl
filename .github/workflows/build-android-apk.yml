name: Android Installable APK

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: 29.0.14206865
  CARGO_TERM_COLOR: never

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK and NDK in GitHub runner
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            tools
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;29.0.14206865
      - name: Export NDK path
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          NDK_ROOT="$SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          test -x "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          echo "NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"
          java -version
          "$SDK_ROOT/platform-tools/adb" version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm --prefix web ci
      - name: Initialize generated Android project
        run: test -d src-tauri/gen/android || npm run android:init -- --ci
      - name: Build installable arm64 debug APK
        shell: bash
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_DEV_INCREMENTAL: 'false'
          CARGO_PROFILE_DEV_OPT_LEVEL: s
          CARGO_PROFILE_DEV_STRIP: symbols
        run: |
          set -o pipefail
          npm run android:build -- --debug --apk --target aarch64 --ci 2>&1 \
            | tee "$RUNNER_TEMP/android-apk.log"
      - name: Publish Android failure summary
        if: failure()
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/android-apk.log" || exit 0
          {
            echo "## Android APK build failure"
            echo
            echo "### Detected error lines"
            echo '```text'
            grep -nE '(^|[[:space:]])e: |error(\[[^]]+\])?:|Caused by:|FAILURE:|What went wrong:|Execution failed' \
              "$RUNNER_TEMP/android-apk.log" | tail -n 100 || true
            echo '```'
            echo
            echo "### Last 200 log lines"
            echo '```text'
            tail -n 200 "$RUNNER_TEMP/android-apk.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Android diagnostic log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eizhu-android-apk-log-${{ github.sha }}
          path: ${{ runner.temp }}/android-apk.log
          if-no-files-found: warn
          retention-days: 14
      - name: Record APK checksum
        id: apk
        shell: bash
        run: |
          APK_PATH="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          sha256sum "$APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          {
            echo "## Android APK"
            echo
            echo "- ABI: arm64-v8a"
            echo "- Type: debug (installable, not for app stores)"
            echo "- File: $(basename "$APK_PATH")"
            echo "- Size: $(du -h "$APK_PATH" | cut -f 1)"
            echo "- SHA-256: $(sha256sum "$APK_PATH" | cut -d ' ' -f 1)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: eizhu-android-debug-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload generated Android project
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eizhu-android-generated-${{ github.sha }}
          path: |
            src-tauri/gen/android/**
            !src-tauri/gen/android/**/.gradle/**
            !src-tauri/gen/android/**/build/**
            !src-tauri/gen/android/local.properties
            !src-tauri/gen/android/keystore.properties
          if-no-files-found: error
          retention-days: 14
