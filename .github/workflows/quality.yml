name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: server/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...

  electron-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            electron/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: server/go.sum
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: go build -tags prod -o xcontrol-server .
        working-directory: server
      - run: npm ci
        working-directory: electron
      - run: xvfb-run -a npm run smoke
        working-directory: electron
