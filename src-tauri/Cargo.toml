[package]
name = "eizhu"
version = "0.4.1"
description = "eizhu 桌面 SSH 终端与 SFTP 管理器（Tauri 2 + Rust）"
authors = ["yuweinfo"]
license = "MIT"
repository = "https://github.com/AfterYuWei/eizhu"
edition = "2021"
rust-version = "1.89"

# 移动端预留：桌面逻辑通过 #[cfg(desktop)] 门控，
# 未来 tauri ios/android init 时以 staticlib/cdylib 形式复用。
[lib]
name = "eizhu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# `tauri build` 编译时自动启用该 feature：webview 使用打包资产（frontendDist，
# tauri://localhost 等自定义协议）；未启用时 tauri 视为 dev 模式并加载 devUrl。
# 纯 cargo build --release 想要生产行为需显式 --features custom-protocol。
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
getrandom = "0.3"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
hmac = "0.12"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "multipart", "rustls-no-provider", "system-proxy"] }
ssh-key = { version = "0.6", features = ["ed25519", "encryption", "getrandom", "rsa"] }
russh = { version = "0.63.2", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0.0"
flate2 = "1.1.10"
tar = "0.4.46"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"

# Tauri 的 `desktop` 是 build-script cfg，Cargo target table 使用等价的 OS 排除条件。
# 这些插件不会进入 Android/iOS 依赖图。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# 文件拖出到系统（社区插件，crabnebula 维护）
tauri-plugin-drag = "2"
# 应用内更新（stable/test 双通道）
tauri-plugin-updater = "2"
# 更新完成后重启
tauri-plugin-process = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-session-keepalive = { path = "plugins/session-keepalive" }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
